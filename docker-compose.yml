version: '3.8'

# ═══════════════════════════════════════════════════════════════════════════════
#                       Memory Store - Local Development Stack
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mem0-qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - mem0-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Memory Store Service
  mem0:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mem0-service
    ports:
      - "8000:8000"
    environment:
      # Service
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8000
      - SERVICE_WORKERS=4
      - SERVICE_LOG_LEVEL=INFO
      
      # Qdrant (connect to qdrant service)
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=memory_store
      - QDRANT_VECTOR_SIZE=1024
      
      # Cohere (REQUIRED - set in .env file)
      - COHERE_API_KEY=${COHERE_API_KEY}
      - COHERE_EMBEDDING_MODEL=embed-english-v3.0
      
      # LLM Gateway (OPTIONAL)
      - LLM_SERVER_URL=${LLM_SERVER_URL:-}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-gpt-4}
      - LLM_OAUTH_ENDPOINT=${LLM_OAUTH_ENDPOINT:-}
      - LLM_CLIENT_ID=${LLM_CLIENT_ID:-}
      - LLM_CLIENT_SECRET=${LLM_CLIENT_SECRET:-}
      
      # Mem0
      - MEM0_VERSION=v1.1
      - MEM0_SEARCH_LIMIT=10
      - MEM0_GRAPH_STORE_ENABLED=false  # Set to true to enable GraphRAG
      - MEM0_GRAPH_STORE_PROVIDER=memgraph
      
      # Memgraph (only needed if MEM0_GRAPH_STORE_ENABLED=true)
      - MEMGRAPH_HOST=memgraph
      - MEMGRAPH_PORT=7687
      - MEMGRAPH_USERNAME=
      - MEMGRAPH_PASSWORD=
    depends_on:
      - qdrant
    networks:
      - mem0-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Memgraph Graph Store (Optional - for GraphRAG)
  # Uncomment to enable relationship-based memory
  memgraph:
    image: memgraph/memgraph:latest
    container_name: mem0-memgraph
    ports:
      - "7687:7687"  # Bolt protocol
      - "7444:7444"  # Monitoring
    volumes:
      - memgraph_data:/var/lib/memgraph
      - memgraph_log:/var/log/memgraph
    environment:
      - MEMGRAPH_LOG_LEVEL=WARNING
    command: ["--log-level=WARNING"]
    networks:
      - mem0-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7687"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Uncomment to enable on startup
    profiles:
      - graph

volumes:
  qdrant_data:
  memgraph_data:
  memgraph_log:

networks:
  mem0-network:
    driver: bridge
