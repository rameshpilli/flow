# Helios Environment Configuration for Memory Store
# Read more: https://rbcgithub.fg.rbc.com/pages/rbc-to/a0d0-helios-docs/docs/Deploy-Your-Application/Deployment-Concepts/Env-Config

compute-fabric:
  environments:
    # Development Environment
    - name: dev
      ucp:
        cluster: ucpdev01.fg.rbc.com
        namespace: isa0-dev
        k8s:
          processing:
            helm:
              command: |
                helm template ./helm/ \
                  --values ./helm/environments/dev/values.yaml \
                  --set ghActionInput.imageTag="${CUSTOM_APP_IMAGE_TAG}" \
                  --set ghActionInput.imageName="${CUSTOM_APP_IMAGE_NAME}"

    # QAT Environment
    - name: qat
      ucp:
        cluster: ucpqa01.saifg.rbc.com
        namespace: isa0-qat
        k8s:
          processing:
            helm:
              command: |
                helm template ./helm/ \
                  --values ./helm/environments/qat/values.yaml \
                  --set ghActionInput.imageTag="${CUSTOM_APP_IMAGE_TAG}" \
                  --set ghActionInput.imageName="${CUSTOM_APP_IMAGE_NAME}"

    # UAT Environment
    - name: uat
      ucp:
        cluster: ucpqa01.saifg.rbc.com
        namespace: isa0-uat
        k8s:
          processing:
            helm:
              command: |
                helm template ./helm/ \
                  --values ./helm/environments/qat/values.yaml \
                  --set ghActionInput.imageTag="${CUSTOM_APP_IMAGE_TAG}" \
                  --set ghActionInput.imageName="${CUSTOM_APP_IMAGE_NAME}"

    # Production Environment
    - name: prod
      ucp:
        cluster: ucpprod04.fg.rbc.com
        namespace: isa0-prod
        k8s:
          processing:
            helm:
              command: |
                helm template ./helm/ \
                  --values ./helm/environments/prod/values.yaml \
                  --set ghActionInput.imageTag="${CUSTOM_APP_IMAGE_TAG}" \
                  --set ghActionInput.imageName="${CUSTOM_APP_IMAGE_NAME}"
