# ═══════════════════════════════════════════════════════════════════════════════
#                       Memory Store Secrets Template
# ═══════════════════════════════════════════════════════════════════════════════
#
# IMPORTANT: This is a TEMPLATE file. Do NOT commit actual secrets to git.
#
# To create the secret in Kubernetes, use one of these methods:
#
# Method 1: Using kubectl create secret
# ───────────────────────────────────────────────────────────────────────────────
# kubectl create secret generic memory-store-secrets \
#   --namespace=memory-store \
#   --from-literal=COHERE_API_KEY='your_cohere_api_key' \
#   --from-literal=QDRANT_API_KEY='your_qdrant_cloud_key' \
#   --from-literal=LLM_OAUTH_ENDPOINT='https://auth.example.com/token' \
#   --from-literal=LLM_CLIENT_ID='your_client_id' \
#   --from-literal=LLM_CLIENT_SECRET='your_client_secret' \
#   --from-literal=LLM_SERVER_URL='https://llm.example.com/v1/chat/completions'
#
# Method 2: Using kubectl apply (encode secrets in base64 first)
# ───────────────────────────────────────────────────────────────────────────────
# echo -n 'your_secret_value' | base64
# Then paste the base64 value below and apply:
# kubectl apply -f k8s/secret.yaml
#
# Method 3: Using external secret management (recommended for production)
# ───────────────────────────────────────────────────────────────────────────────
# - AWS Secrets Manager + External Secrets Operator
# - HashiCorp Vault
# - Google Secret Manager
# - Azure Key Vault
#
# ═══════════════════════════════════════════════════════════════════════════════

apiVersion: v1
kind: Secret
metadata:
  name: memory-store-secrets
  namespace: memory-store
  labels:
    app: memory-store
type: Opaque
data:
  # COHERE_API_KEY: <base64-encoded-cohere-api-key>
  # QDRANT_API_KEY: <base64-encoded-qdrant-api-key>
  # LLM_OAUTH_ENDPOINT: <base64-encoded-oauth-endpoint>
  # LLM_CLIENT_ID: <base64-encoded-client-id>
  # LLM_CLIENT_SECRET: <base64-encoded-client-secret>
  # LLM_SERVER_URL: <base64-encoded-server-url>
  # LLM_API_KEY: <base64-encoded-api-key>

# Example of base64 encoding:
# echo -n 'my-secret-value' | base64
# Output: bXktc2VjcmV0LXZhbHVl
