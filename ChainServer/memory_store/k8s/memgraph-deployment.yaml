apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memgraph-data-pvc
  namespace: memory-store
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # Uncomment and set storageClassName for specific storage class
  # storageClassName: fast-ssd

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memgraph-log-pvc
  namespace: memory-store
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memgraph
  namespace: memory-store
  labels:
    app: memgraph
    component: graph-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memgraph
  template:
    metadata:
      labels:
        app: memgraph
        component: graph-store
    spec:
      containers:
        - name: memgraph
          image: memgraph/memgraph:latest
          ports:
            - name: bolt
              containerPort: 7687
              protocol: TCP
            - name: monitoring
              containerPort: 7444
              protocol: TCP
          env:
            - name: MEMGRAPH_LOG_LEVEL
              value: "WARNING"
          command:
            - /usr/lib/memgraph/memgraph
            - --log-level=WARNING
            - --storage-properties-on-edges=true
            - --storage-snapshot-interval-sec=300
          volumeMounts:
            - name: memgraph-data
              mountPath: /var/lib/memgraph
            - name: memgraph-log
              mountPath: /var/log/memgraph
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: memgraph-data
          persistentVolumeClaim:
            claimName: memgraph-data-pvc
        - name: memgraph-log
          persistentVolumeClaim:
            claimName: memgraph-log-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: memgraph-service
  namespace: memory-store
  labels:
    app: memgraph
spec:
  type: ClusterIP
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687
      protocol: TCP
    - name: monitoring
      port: 7444
      targetPort: 7444
      protocol: TCP
  selector:
    app: memgraph
