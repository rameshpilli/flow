apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-store
  namespace: memory-store
  labels:
    app: memory-store
    component: api-service
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: memory-store
  template:
    metadata:
      labels:
        app: memory-store
        component: api-service
    spec:
      # Service account for RBAC (if needed)
      # serviceAccountName: memory-store-sa
      
      # Init container to wait for Qdrant
      initContainers:
        - name: wait-for-qdrant
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              until nc -z qdrant-service 6333; do
                echo "Waiting for Qdrant..."
                sleep 2
              done
              echo "Qdrant is ready!"
      
      containers:
        - name: memory-store
          image: your-registry/memory-store:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          
          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: memory-store-config
          
          # Sensitive environment variables from Secret
          env:
            - name: COHERE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: memory-store-secrets
                  key: COHERE_API_KEY
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: memory-store-secrets
                  key: QDRANT_API_KEY
                  optional: true
            - name: LLM_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: memory-store-secrets
                  key: LLM_SERVER_URL
                  optional: true
            - name: LLM_OAUTH_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: memory-store-secrets
                  key: LLM_OAUTH_ENDPOINT
                  optional: true
            - name: LLM_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: memory-store-secrets
                  key: LLM_CLIENT_ID
                  optional: true
            - name: LLM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: memory-store-secrets
                  key: LLM_CLIENT_SECRET
                  optional: true
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: memory-store-secrets
                  key: LLM_API_KEY
                  optional: true
          
          # Resource limits and requests
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          
          # Health checks
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          # Security context
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      
      # Pod security context
      securityContext:
        fsGroup: 1000
      
      # Node affinity (optional - for specific node pools)
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #             - key: workload-type
      #               operator: In
      #               values:
      #                 - ai-workloads
      
      # Tolerations (optional - for tainted nodes)
      # tolerations:
      #   - key: "ai-workload"
      #     operator: "Equal"
      #     value: "true"
      #     effect: "NoSchedule"

---
apiVersion: v1
kind: Service
metadata:
  name: memory-store-service
  namespace: memory-store
  labels:
    app: memory-store
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: memory-store

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memory-store-hpa
  namespace: memory-store
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memory-store
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
