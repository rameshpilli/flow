site_name: AgentOrchestrator
site_description: A DAG-based Chain Orchestration Framework for AI/ML Pipelines
site_url: https://your-org.github.io/agentorchestrator
repo_url: https://github.com/your-org/agentorchestrator
repo_name: your-org/agentorchestrator

docs_dir: agentorchestrator/docs
site_dir: site

theme:
  name: material
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.svg
  favicon: assets/favicon.ico

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - minify:
      minify_html: true

# Validation settings - set to warn instead of error for broken links
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

  # PyMdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: your-org
      repo: agentorchestrator
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/agentorchestrator
  generator: false
  version:
    provider: mike
    default: stable

extra_css:
  - stylesheets/extra.css

# Uncomment if you want to add custom JS
# extra_javascript:
#   - javascripts/extra.js

nav:
  - Home: index.md

  - Getting Started:
    - Quick Start: QUICKSTART.md
    - Requirements: REQUIREMENTS.md

  - Understanding:
    - Overview: understanding/index.md
    - Context: understanding/context.md
    - Steps & Chains: understanding/steps_and_chains.md
    - Agents: understanding/agents.md
    - Multi-Agent Systems: understanding/multi_agent.md

  - Patterns:
    - Overview: patterns/index.md
    - Context Isolation: patterns/context_isolation.md
    - Summarization: patterns/summarization.md
    - Aggregation: patterns/aggregation.md
    - Routing: patterns/routing.md

  - Reference:
    - Architecture: ARCHITECTURE.md
    - API Reference: API.md
    - Context Management: CONTEXT_MANAGEMENT.md
    - Feature Examples: FEATURE_EXAMPLES.md

  - Help:
    - Troubleshooting: TROUBLESHOOTING.md

copyright: Copyright &copy; 2024-2026 AgentOrchestrator
