[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentorchestrator"
version = "0.1.0"
description = "A DAG-based chain orchestration framework for AI/ML pipelines"
readme = "agentorchestrator/README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["ai", "ml", "chains", "dag", "orchestration", "llm", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "structlog>=23.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
ao = "agentorchestrator.cli:main"
agentorchestrator = "agentorchestrator.cli:main"

[project.urls]
Repository = "https://github.com/your-org/agentorchestrator"

[tool.hatch.build.targets.wheel]
packages = ["agentorchestrator"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["agentorchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["agentorchestrator/tests"]
addopts = ["-ra", "-q"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["agentorchestrator"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 70
