# Development environment overrides

replicaCount: 1

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false

configuration:
  LOG_LEVEL: "DEBUG"
  DEVELOPMENT: "true"
  MAX_QUERY_ROWS: "1000"
  QUERY_TIMEOUT_SECONDS: "30"
  
  # Cache settings for dev (shorter TTLs)
  ENABLE_CACHING: "true"
  CACHE_TTL_TABLES_LIST: "1800"      # 30 minutes
  CACHE_TTL_TABLE_SCHEMA: "3600"     # 1 hour
  CACHE_TTL_QUERY_RESULTS: "180"     # 3 minutes

redis:
  maxMemory: 128mb
