environment: dev

image:
  artifactoryRepo: docker-isa0-dev

imagePullSecrets:
  - name: artifactory-docker-isa0-dev-secret

# Override defaults: Enable autoscaling for DEV
autoscaling:
  enabled: true
  minReplicas: 1    # DEV-specific: smaller scale
  maxReplicas: 3    # DEV-specific: lower max

# Qdrant enabled by default
qdrant:
  enabled: true
  persistence:
    size: 5Gi  # Smaller for dev

# Memgraph disabled by default (enable if testing GraphRAG)
memgraph:
  enabled: false
  persistence:
    dataSize: 2Gi  # Smaller for dev
    logsSize: 500Mi

# Ingress configuration for DEV
ingress:
  enabled: true
  className: ""
  namespace: isa0-dev
  host: mem0.cfk.devfg.rbc.com
  secretName: mem0-cert-tls
  annotations:
    cert-manager.io.issuer: chorus
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  tls:
    - secretName: mem0-cert-tls
      hosts:
        - mem0.cfk.devfg.rbc.com
  hosts:
    - host: mem0.cfk.devfg.rbc.com
      paths:
        - path: /
          pathType: Prefix

# Application configuration for DEV
configuration:
  # Service Configuration
  SERVICE_HOST: "0.0.0.0"
  SERVICE_PORT: "'8000'"
  SERVICE_WORKERS: "'2'"  # Fewer workers in dev
  SERVICE_LOG_LEVEL: "DEBUG"  # More verbose logging in dev
  
  # LLM Gateway Configuration (RBC internal - DEV) - PREFERRED for embeddings
  LLM_SERVER_URL: "https://llm-gateway-dev.fg.rbc.com"  # Update with actual DEV URL
  LLM_OAUTH_ENDPOINT: "https://llm-gateway-dev.fg.rbc.com/oauth/token"  # Update with actual OAuth endpoint
  LLM_CLIENT_ID: ""  # Managed via Vault
  LLM_CLIENT_SECRET: ""  # Managed via Vault
  LLM_EMBEDDING_MODEL: "text-embedding-3-large"
  LLM_EMBEDDING_DIMS: "'3072'"
  
  # Cohere Configuration (LEGACY - use LLM Gateway instead)
  # COHERE_API_KEY: ""  # Managed via Vault
  # COHERE_EMBEDDING_MODEL: "embed-english-v3.0"
  
  # Qdrant Configuration (internal service)
  QDRANT_HOST: "mem0-qdrant"
  QDRANT_PORT: "'6333'"
  QDRANT_COLLECTION_NAME: "agent_memories_dev"
  QDRANT_VECTOR_SIZE: "'3072'"  # text-embedding-3-large dimensions
  
  # Memgraph Configuration (optional)
  MEMGRAPH_HOST: "mem0-memgraph"
  MEMGRAPH_PORT: "'7687'"
  
  # Mem0 Configuration
  MEM0_GRAPH_STORE_ENABLED: "'false'"  # Set to 'true' to enable GraphRAG
  MEM0_GRAPH_STORE_PROVIDER: "memgraph"
  MEM0_HISTORY_LIMIT: "'10'"
  
  # Feature Flags
  DO_NOT_TRACK: "'true'"
  SCARF_NO_ANALYTICS: "'true'"
  
  # Vault Configuration (managed by Helios)
  VAULT_TOKEN: "dummy"
  VAULT_SECRETS: "dummy"
  VAULT_URL: "https://vault.fg.rbc.com/v1"
  VAULT_PATH: "dummy"

# Resource limits for DEV (lower than production)
resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi
