environment: qat

image:
  artifactoryRepo: docker-isa0-qat

imagePullSecrets:
  - name: artifactory-docker-isa0-qat-secret

# Override defaults: Enable autoscaling for QAT
autoscaling:
  enabled: true
  minReplicas: 2    # QAT-specific
  maxReplicas: 5

# Qdrant enabled
qdrant:
  enabled: true
  persistence:
    size: 10Gi

# Memgraph enabled for testing GraphRAG
memgraph:
  enabled: true
  persistence:
    dataSize: 5Gi
    logsSize: 1Gi

# Ingress configuration for QAT
ingress:
  enabled: true
  className: ""
  namespace: isa0-qat
  host: mem0.cfkqa.saifg.rbc.com
  secretName: mem0-cert-tls
  annotations:
    cert-manager.io.issuer: chorus
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  tls:
    - secretName: mem0-cert-tls
      hosts:
        - mem0.cfkqa.saifg.rbc.com
  hosts:
    - host: mem0.cfkqa.saifg.rbc.com
      paths:
        - path: /
          pathType: Prefix

# Application configuration for QAT
configuration:
  # Service Configuration
  SERVICE_HOST: "0.0.0.0"
  SERVICE_PORT: "'8000'"
  SERVICE_WORKERS: "'4'"
  SERVICE_LOG_LEVEL: "INFO"
  
  # LLM Gateway Configuration (RBC internal - QAT)
  LLM_GATEWAY_BASE_URL: "https://llm-gateway-qat.saifg.rbc.com"  # Update with actual QAT URL
  LLM_GATEWAY_AUTH_TYPE: "oauth"
  
  # Cohere Configuration (QAT)
  COHERE_MODEL: "embed-english-v3.0"
  
  # Qdrant Configuration
  QDRANT_HOST: "mem0-qdrant"
  QDRANT_PORT: "'6333'"
  QDRANT_COLLECTION_NAME: "agent_memories_qat"
  
  # Memgraph Configuration (enabled in QAT for testing)
  MEMGRAPH_HOST: "mem0-memgraph"
  MEMGRAPH_PORT: "'7687'"
  
  # Mem0 Configuration
  MEM0_GRAPH_STORE_ENABLED: "'true'"  # GraphRAG enabled in QAT for testing
  MEM0_GRAPH_STORE_PROVIDER: "memgraph"
  MEM0_HISTORY_LIMIT: "'10'"
  
  # Feature Flags
  DO_NOT_TRACK: "'true'"
  SCARF_NO_ANALYTICS: "'true'"
  
  # Vault Configuration
  VAULT_TOKEN: "dummy"
  VAULT_SECRETS: "dummy"
  VAULT_URL: "https://vault.fg.rbc.com/v1"
  VAULT_PATH: "dummy"

# Resources for QAT (between dev and prod)
resources:
  limits:
    cpu: 1500m
    memory: 3Gi
  requests:
    cpu: 500m
    memory: 1Gi
