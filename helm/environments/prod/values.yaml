environment: prod

image:
  artifactoryRepo: docker-isa0-prod

imagePullSecrets:
  - name: artifactory-docker-isa0-prod-secret

# Override defaults: Enable autoscaling for PROD
autoscaling:
  enabled: true
  minReplicas: 3    # PROD-specific: higher minimum
  maxReplicas: 10   # PROD-specific: higher maximum

# Qdrant enabled with larger storage
qdrant:
  enabled: true
  persistence:
    size: 50Gi  # Larger for production

# Memgraph enabled for GraphRAG
memgraph:
  enabled: true
  persistence:
    dataSize: 20Gi
    logsSize: 2Gi

# Ingress configuration for PROD
ingress:
  enabled: true
  className: ""
  namespace: isa0-prod
  host: memory-store.cfkprod.fg.rbc.com
  secretName: memory-store-cert-tls
  annotations:
    cert-manager.io.issuer: chorus
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "100"  # Rate limiting in prod
  tls:
    - secretName: memory-store-cert-tls
      hosts:
        - memory-store.cfkprod.fg.rbc.com
  hosts:
    - host: memory-store.cfkprod.fg.rbc.com
      paths:
        - path: /
          pathType: Prefix

# Application configuration for PROD
configuration:
  # Service Configuration
  SERVICE_HOST: "0.0.0.0"
  SERVICE_PORT: "'8000'"
  SERVICE_WORKERS: "'8'"  # More workers in production
  SERVICE_LOG_LEVEL: "INFO"
  
  # LLM Gateway Configuration (RBC internal - PROD)
  LLM_GATEWAY_BASE_URL: "https://llm-gateway.fg.rbc.com"  # Update with actual PROD URL
  LLM_GATEWAY_AUTH_TYPE: "oauth"
  
  # Cohere Configuration (PROD)
  COHERE_MODEL: "embed-english-v3.0"
  
  # Qdrant Configuration
  QDRANT_HOST: "memory-store-qdrant"
  QDRANT_PORT: "'6333'"
  QDRANT_COLLECTION_NAME: "agent_memories_prod"
  
  # Memgraph Configuration
  MEMGRAPH_HOST: "memory-store-memgraph"
  MEMGRAPH_PORT: "'7687'"
  
  # Mem0 Configuration
  MEM0_GRAPH_STORE_ENABLED: "'true'"  # GraphRAG enabled in production
  MEM0_GRAPH_STORE_PROVIDER: "memgraph"
  MEM0_HISTORY_LIMIT: "'10'"
  
  # Feature Flags
  DO_NOT_TRACK: "'true'"
  SCARF_NO_ANALYTICS: "'true'"
  
  # Vault Configuration
  VAULT_TOKEN: "dummy"
  VAULT_SECRETS: "dummy"
  VAULT_URL: "https://vault.fg.rbc.com/v1"
  VAULT_PATH: "dummy"

# Full resources for PROD
resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 2Gi

# Affinity for production (spread across nodes)
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - memory-store
          topologyKey: kubernetes.io/hostname
