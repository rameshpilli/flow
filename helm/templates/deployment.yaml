apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memory-store.fullname" . }}
  labels:
    {{- include "memory-store.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "memory-store.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "memory-store.selectorLabels" . | nindent 8 }}
        cf.rbccm.com/logging-enabled: "true"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "memory-store.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      
      # Init container to wait for Qdrant
      {{- if .Values.qdrant.enabled }}
      initContainers:
        - name: wait-for-qdrant
          image: busybox:latest
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for Qdrant to be ready..."
              until nc -z {{ include "memory-store.fullname" . }}-qdrant {{ .Values.qdrant.service.port }}; do
                echo "Qdrant not ready yet, waiting..."
                sleep 5
              done
              echo "Qdrant is ready!"
        {{- if .Values.memgraph.enabled }}
        - name: wait-for-memgraph
          image: busybox:latest
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for Memgraph to be ready..."
              until nc -z {{ include "memory-store.fullname" . }}-memgraph {{ .Values.memgraph.service.boltPort }}; do
                echo "Memgraph not ready yet, waiting..."
                sleep 5
              done
              echo "Memgraph is ready!"
        {{- end }}
      {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.artifactoryRepo }}.{{ .Values.rbc.artifactory.host }}/{{ .Values.image.name }}:{{ .Values.ghActionInput.imageTag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          
          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: "{{ .Chart.Name }}-cfgmap"
          
          # Health checks
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
