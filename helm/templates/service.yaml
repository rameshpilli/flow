apiVersion: v1
kind: Service
metadata:
  name: {{ include "mem0.fullname" . }}
  labels:
    {{- include "mem0.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours - keeps same agent on same pod for memory consistency
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "mem0.selectorLabels" . | nindent 4 }}
