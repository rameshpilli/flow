# RBC Corporate Configuration
rbc:
  appCode: isa0  # Update with your app code
  artifactory:
    host: artifactory.fg.rbc.com

# Image configuration
# The 'artifactoryRepo' varies by environment (see helm/environments/<env>/values.yaml)
image:
  name: isa0-memory-store
  pullPolicy: IfNotPresent
  artifactoryRepo: docker-isa0-dev  # Default to dev, override per environment

# Values set by k8s config processing action (Helios)
# https://rbcgithub.fg.rbc.com/rbc-to/a0d0-helios-k8s-config-processing-action
ghActionInput:
  imageTag: ""         # Image tag (set by CI/CD)
  imageName: ""        # Fully-resolved image name
  branchName: ""       # GitHub branch name
  isReleaseBranch: false

# ============================================================================
# Standard Helm Values
# ============================================================================

replicaCount: 1

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false  # Configure per environment
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: false  # Enable per environment
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ============================================================================
# Memory Store Specific Configuration
# ============================================================================

# Qdrant Vector Database
qdrant:
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: v1.7.4
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""  # Use default storage class
  service:
    port: 6333

# Memgraph Graph Database (optional for GraphRAG)
memgraph:
  enabled: false  # Enable per environment if needed
  image:
    repository: memgraph/memgraph
    tag: latest
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  persistence:
    enabled: true
    dataSize: 5Gi
    logsSize: 1Gi
    storageClassName: ""
  service:
    boltPort: 7687
    httpPort: 7444

# Memory Store Application Configuration
# These values will be injected as environment variables via ConfigMap
# Sensitive values (API keys) should be managed via Vault
configuration:
  # Service Configuration
  SERVICE_HOST: "0.0.0.0"
  SERVICE_PORT: "'8000'"
  SERVICE_WORKERS: "'4'"
  SERVICE_LOG_LEVEL: "INFO"
  
  # LLM Gateway Configuration (RBC internal)
  LLM_GATEWAY_BASE_URL: "https://llm-gateway.fg.rbc.com"  # Update with actual URL
  LLM_GATEWAY_AUTH_TYPE: "oauth"
  # LLM_GATEWAY_API_KEY and OAuth credentials managed via Vault
  
  # Qdrant Configuration (internal service)
  QDRANT_HOST: "memory-store-qdrant"
  QDRANT_PORT: "'6333'"
  QDRANT_COLLECTION_NAME: "agent_memories"
  
  # Memgraph Configuration (optional, internal service)
  MEMGRAPH_HOST: "memory-store-memgraph"
  MEMGRAPH_PORT: "'7687'"
  
  # Mem0 Configuration
  MEM0_GRAPH_STORE_ENABLED: "'false'"  # Set to 'true' to enable GraphRAG
  MEM0_GRAPH_STORE_PROVIDER: "memgraph"
  MEM0_HISTORY_LIMIT: "'10'"
  
  # Feature Flags
  DO_NOT_TRACK: "'true'"
  SCARF_NO_ANALYTICS: "'true'"

# Vault integration (secrets managed separately)
vaultValues: {}

nodeSelector: {}
tolerations: []
affinity: {}
