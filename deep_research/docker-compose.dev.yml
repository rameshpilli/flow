version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Local development environment for Deep Research Agent
#
#  Services:
#    redis      – Redis 7 for context offload / middleware caching
#    mock-mcp   – Fake RavenPack + CapIQ MCP server (fixture data)
#
#  Usage:
#    docker compose -f docker-compose.dev.yml up -d
#    # Then start the agent service locally:
#    uvicorn deep_research.server:app --port 8000 --env-file deep_research/.env.dev
#
#  Teardown:
#    ./deep_research/cleanup_dev.sh
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: deep_research_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --save 60 1
        --loglevel notice
        --requirepass devpassword
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "devpassword", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Mock MCP server ────────────────────────────────────────────────────────
  mock-mcp:
    build:
      context: ..
      dockerfile: deep_research/Dockerfile.mock
    container_name: deep_research_mock_mcp
    ports:
      - "8001:8001"
    environment:
      MOCK_MCP_PORT: "8001"
    volumes:
      # Mount fixtures so you can edit them without rebuilding
      - ./fixtures:/app/deep_research/fixtures:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
